name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is tested by the deploy workflow
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:node
      - run: npm run test:browser   # uses the Google Chrome preinstalled on the runner
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
